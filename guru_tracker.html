function fmv(n){
  if(n==null)return'–';
  if(n>=1000)return`$${(n/1000).toFixed(1)}B`;
  if(n>=100)return`$${n.toFixed(0)}M`;
  return`$${n.toFixed(1)}M`;
}
function fsh(n){
  if(n==null||n===0)return'–';
  if(n>=1000000)return`${(n/1000000).toFixed(1)}Mrd`;
  if(n>=1000)return`${(n/1000).toFixed(0)}T`;
  return`${n}`;
}
function fperiod(s){
  if(!s)return'–';
  try{const d=new Date(s+'T00:00:00');const q=Math.ceil((d.getMonth()+1)/3);return`Q${q} ${d.getFullYear()}`;}
  catch{return s;}
}

// ── Donut Chart ───────────────────────────────────────────────────────────
function DonutChart({sectors}){
  if(!sectors||sectors.length===0)return null;
  const cx=90,cy=90,r=72,ir=46;
  const total=sectors.reduce((s,x)=>s+x.value,0);
  const slices=[];
  let ang=-Math.PI/2;
  sectors.forEach((s,i)=>{
    const frac=s.value/total;
    const a=frac*2*Math.PI;
    if(a<0.001)return;
    const x1=cx+r*Math.cos(ang),y1=cy+r*Math.sin(ang);
    const na=ang+a;
    const x2=cx+r*Math.cos(na),y2=cy+r*Math.sin(na);
    const ix2=cx+ir*Math.cos(na),iy2=cy+ir*Math.sin(na);
    const ix1=cx+ir*Math.cos(ang),iy1=cy+ir*Math.sin(ang);
    const large=a>Math.PI?1:0;
    slices.push(
      <path key={i}
        d={`M${x1},${y1}A${r},${r},0,${large},1,${x2},${y2}L${ix2},${iy2}A${ir},${ir},0,${large},0,${ix1},${iy1}Z`}
        fill={s.color} stroke="#111827" strokeWidth="2"/>
    );
    ang=na;
  });
  return(
    <svg viewBox="0 0 180 180" width="160" height="160" style={{display:'block',margin:'0 auto'}}>
      {slices}
      <circle cx={cx} cy={cy} r={ir-1} fill="#0a0f1e"/>
    </svg>
  );
}

function mkSignal(ms){
  if(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)return AbortSignal.timeout(ms);
  const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;
}

// ── SEC: get list of all 13F-HR filings ───────────────────────────────────
async function fetchFilingsList(cik){
  const padded=cik.replace(/\D/g,'').padStart(10,'0');
  const res=await fetch(`https://data.sec.gov/submissions/CIK${padded}.json`,
    {signal:mkSignal(18000)});
  if(!res.ok)throw new Error(`SEC HTTP ${res.status}`);
  const sub=await res.json();
  const rec=sub.filings?.recent;
  if(!rec?.form)throw new Error('Keine Filings-Daten von SEC');
  const out=[];
  for(let i=0;i<rec.form.length;i++){
    if(rec.form[i]==='13F-HR'){
      out.push({
        accNum:rec.accessionNumber[i],
        period:rec.reportDate?.[i]||'',
        filingDate:rec.filingDate?.[i]||'',
      });
    }
  }
  if(!out.length)throw new Error('Kein 13F-HR Filing gefunden');
  return out; // newest first
}

// ── SEC: fetch holdings for one specific filing ───────────────────────────
async function fetchFilingData(cik,f){
  const padded=cik.replace(/\D/g,'').padStart(10,'0');
  const numeric=String(parseInt(padded,10));
  const accFlat=f.accNum.replace(/-/g,'');

  const idxRes=await fetch(
    `https://www.sec.gov/Archives/edgar/data/${numeric}/${accFlat}/index.json`,
    {signal:mkSignal(18000)}
  );
  if(!idxRes.ok)throw new Error(`Filing-Index HTTP ${idxRes.status}`);
  const idxData=await idxRes.json();

  const items=idxData.directory?.item||[];
  const xmlItem=
    items.find(it=>it.name.toLowerCase().includes('infotable')&&it.name.toLowerCase().endsWith('.xml'))||
    items.find(it=>it.name.toLowerCase().endsWith('.xml')&&!it.name.toLowerCase().startsWith('primary'));
  if(!xmlItem)throw new Error('InfoTable-XML nicht im Filing gefunden');

  const xmlRes=await fetch(
    `https://www.sec.gov/Archives/edgar/data/${numeric}/${accFlat}/${xmlItem.name}`,
    {signal:mkSignal(28000)}
  );
  if(!xmlRes.ok)throw new Error(`XML HTTP ${xmlRes.status}`);
  const xmlText=await xmlRes.text();

  const doc=new DOMParser().parseFromString(xmlText,'application/xml');
  const rows=doc.querySelectorAll('infoTable');
  if(!rows.length)throw new Error('Keine Holdings im XML');

  const map={};
  rows.forEach(r=>{
    const name=(r.querySelector('nameOfIssuer')?.textContent||'').trim();
    const val=parseInt(r.querySelector('value')?.textContent||'0',10);
    const shr=parseInt(r.querySelector('sshPrnamt')?.textContent||'0',10);
    if(!name||val<=0)return;
    const key=name.toUpperCase();
    if(map[key]){map[key].value+=val/1000;map[key].shares+=shr;}
    else map[key]={name,value:val/1000,shares:shr,sector:'Sonstiges',chg:'hold',chgPct:null,ticker:''};
  });
  const all=Object.values(map).sort((a,b)=>b.value-a.value);
  return{
    period:fperiod(f.period),
    filingDate:f.filingDate,
    totalValue:all.reduce((s,h)=>s+h.value,0),
    holdings:all.slice(0,25),
    source:'live',
  };
}

// ── Yahoo Finance chart data ──────────────────────────────────────────────
async function fetchYahooChart(ticker,yRange){
  const t=ticker.trim().toUpperCase();
  for(const base of['query1','query2']){
    try{
      const res=await fetch(
        `https://${base}.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t)}?interval=1mo&range=${yRange}`,
        {headers:{Accept:'application/json'},signal:mkSignal(12000)}
      );
      if(!res.ok)continue;
      const j=await res.json();
      const result=j.chart?.result?.[0];
      if(!result)continue;
      const timestamps=(result.timestamp||[]).map(ts=>ts*1000);
      const prices=result.indicators?.adjclose?.[0]?.adjclose||result.indicators?.quote?.[0]?.close||[];
      if(timestamps.length>1)return{ticker:t,timestamps,prices};
    }catch(e){}
  }
  /* FMP Fallback — monthly historical */
  const fk=window.__FMP_KEY__||'';
  if(fk){
    try{
      const fmpT=t==='^GSPC'?'SPY':t;
      const res=await fetch(
        `https://financialmodelingprep.com/api/v3/historical-chart/1month/${encodeURIComponent(fmpT)}?apikey=${fk}`,
        {signal:mkSignal(12000)});
      if(res.ok){
        const data=await res.json();
        if(Array.isArray(data)&&data.length>1){
          const sorted=data.slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
          return{ticker:t,timestamps:sorted.map(d=>new Date(d.date).getTime()),prices:sorted.map(d=>d.close)};
        }
      }
    }catch(e){}
  }
  throw new Error(`${t}: Kursverlauf nicht abrufbar`);
}

// ── Performance Chart ─────────────────────────────────────────────────────
function PerfChart({selId,range}){
  const [st,setSt]=useState({loading:false,err:'',series:null});

  useEffect(()=>{
    const holdings=(MOCK[selId]?.holdings||[]).filter(h=>h.ticker&&h.chg!=='sold');
    if(!holdings.length){setSt({loading:false,err:'Keine Ticker für diesen Investor',series:null});return;}
    let cancelled=false;
    setSt({loading:true,err:'',series:null});

    const topH=holdings.slice(0,10);
    const totalVal=topH.reduce((s,h)=>s+h.value,0);
    const yRange={'6m':'6mo','1y':'1y','2y':'2y','5y':'5y'}[range]||'1y';
    const tickers=[...topH.map(h=>h.ticker),'^GSPC'];

    function normalize(timestamps,prices){
      const valid=[];
      for(let i=0;i<timestamps.length;i++){
        const p=prices[i];
        if(p!=null&&!isNaN(p)&&p>0)valid.push({t:timestamps[i],p});
      }
      if(valid.length<2)return null;
      const base=valid[0].p;
      return valid.map(x=>({t:x.t,ret:(x.p/base-1)*100}));
    }

    Promise.allSettled(tickers.map(t=>fetchYahooChart(t,yRange))).then(results=>{
      if(cancelled)return;
      const spxR=results[results.length-1];
      const spxNorm=spxR.status==='fulfilled'
        ?normalize(spxR.value.timestamps,spxR.value.prices)
        :null;

      const holdNorm=[];
      for(let i=0;i<topH.length;i++){
        if(results[i].status!=='fulfilled')continue;
        const ns=normalize(results[i].value.timestamps,results[i].value.prices);
        if(!ns)continue;
        holdNorm.push({ns,weight:topH[i].value/totalVal});
      }
      if(!holdNorm.length){setSt({loading:false,err:'Keine Kursdaten verfügbar',series:null});return;}

      // Build portfolio series — align to SPX timeline if available, else use own timestamps
      const refTs=spxNorm?spxNorm.map(p=>p.t):holdNorm[0].ns.map(p=>p.t);
      const portSeries=refTs.map(t=>{
        let sumR=0,sumW=0;
        holdNorm.forEach(({ns,weight})=>{
          let best=ns[0];
          for(const p of ns){if(Math.abs(p.t-t)<Math.abs(best.t-t))best=p;}
          sumR+=best.ret*weight;
          sumW+=weight;
        });
        return sumW>0.05?{t,ret:sumR/sumW}:null;
      }).filter(Boolean);

      // Re-anchor portfolio to 0% at first point
      if(portSeries.length>0){
        const base=portSeries[0].ret;
        portSeries.forEach(p=>{p.ret-=base;});
      }

      setSt({loading:false,err:'',series:{port:portSeries,spx:spxNorm||[]}});
    }).catch(e=>{
      if(!cancelled)setSt({loading:false,err:String(e.message||e),series:null});
    });

    return()=>{cancelled=true;};
  },[selId,range]);

  const {loading,err,series}=st;

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'18px 0',color:'#566380',fontSize:'11px'}}>
      <span className="spin-sm"/><span>Kursdaten werden geladen…</span>
    </div>
  );
  if(err)return <div className="err">⚠️ {err}</div>;
  if(!series)return null;

  const {port,spx}=series;
  const hasSpx=spx&&spx.length>=2;
  if(port.length<2)return <div className="err">Zu wenige Datenpunkte</div>;

  const allRets=[...port.map(p=>p.ret),...(hasSpx?spx.map(p=>p.ret):[])].filter(r=>!isNaN(r));
  const minR=Math.min(...allRets),maxR=Math.max(...allRets);
  const pad=(maxR-minR)*0.12+2;
  const yMin=minR-pad,yMax=maxR+pad;

  const W=460,H=185,mx=42,my=12,mr=14,mb=26;
  const cW=W-mx-mr,cH=H-my-mb;

  const allTs=[...new Set([...port,...(hasSpx?spx:[])].map(p=>p.t))].sort((a,b)=>a-b);
  const tMin=allTs[0],tMax=allTs[allTs.length-1],tRange=tMax-tMin||1;

  const tx=t=>mx+(t-tMin)/tRange*cW;
  const ty=r=>my+cH-(r-yMin)/(yMax-yMin)*cH;
  const mkPath=pts=>pts.filter(p=>!isNaN(p.ret)).map((p,i)=>`${i?'L':'M'}${tx(p.t).toFixed(1)},${ty(p.ret).toFixed(1)}`).join('');

  const portFinal=port[port.length-1]?.ret??0;
  const spxFinal=hasSpx?spx[spx.length-1]?.ret??0:null;
  const portColor=portFinal>=0?'#00c9a7':'#ff4757';
  const fmtR=r=>(r>=0?'+':'')+r.toFixed(1)+'%';
  const fmtDt=t=>new Date(t).toLocaleDateString('de-DE',{month:'short',year:'2-digit'});

  const nxt=5;
  const xTicks=Array.from({length:nxt},(_,i)=>{
    const idx=Math.round(i*(allTs.length-1)/(nxt-1));
    const t=allTs[Math.min(idx,allTs.length-1)];
    return{t,x:tx(t)};
  });
  const yTicks=Array.from({length:5},(_,i)=>{
    const r=yMin+i*(yMax-yMin)/4;
    return{r,y:ty(r)};
  });
  const zY=ty(0);

  return(
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
        {yTicks.map(({r,y},i)=>(
          <g key={i}>
            <line x1={mx} y1={y} x2={mx+cW} y2={y} stroke="#1a2440" strokeWidth="1"/>
            <text x={mx-4} y={y+3.5} textAnchor="end" fill="#566380" fontSize="9">{r>=0?'+':''}{r.toFixed(0)}%</text>
          </g>
        ))}
        {zY>=my&&zY<=my+cH&&(
          <line x1={mx} y1={zY} x2={mx+cW} y2={zY} stroke="#2a3854" strokeWidth="1.5" strokeDasharray="4,3"/>
        )}
        {xTicks.map(({t,x},i)=>(
          <text key={i} x={x} y={H-5} textAnchor="middle" fill="#566380" fontSize="8.5">{fmtDt(t)}</text>
        ))}
        {hasSpx&&<path d={mkPath(spx)} fill="none" stroke="#566380" strokeWidth="1.5" opacity=".85"/>}
        <path d={mkPath(port)} fill="none" stroke={portColor} strokeWidth="2"/>
        <circle cx={mx+cW-105} cy={my+7} r="4" fill={portColor}/>
        <text x={mx+cW-97} y={my+11} fill="#c4cfe0" fontSize="9.5">Portfolio {fmtR(portFinal)}</text>
        {hasSpx&&<><circle cx={mx+cW-105} cy={my+22} r="4" fill="#566380"/>
        <text x={mx+cW-97} y={my+26} fill="#8a9bb5" fontSize="9.5">S&amp;P 500 {fmtR(spxFinal)}</text></>}
      </svg>
      <div style={{color:'#3a4a60',fontSize:'9px',textAlign:'right',marginTop:4}}>Basis: Mock-Ticker · Kursentwicklung kumuliert ab Startdatum</div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────
function App(){
  const[selId,setSelId]=useState('berkshire');
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(false);
  const[liveErr,setLiveErr]=useState('');
  const[isLive,setIsLive]=useState(false);
  const[sortCol,setSortCol]=useState('value');
  const[sortAsc,setSortAsc]=useState(false);
  const[filings,setFilings]=useState([]);
  const[filIdx,setFilIdx]=useState(0);
  const[showChart,setShowChart]=useState(false);
  const[chartRange,setChartRange]=useState('1y');

  const inv=INVESTORS.find(x=>x.id===selId)||INVESTORS[0];

  useEffect(()=>{
    setData({...MOCK[selId],source:'mock'});
    setIsLive(false);setLiveErr('');
    setSortCol('value');setSortAsc(false);
    setFilings([]);setFilIdx(0);
  },[selId]);

  async function loadLive(){
    if(inv.mockOnly){setLiveErr('Für diesen Investor ist kein bestätigtes SEC-CIK hinterlegt.');return;}
    setLoading(true);setLiveErr('');
    try{
      const flist=await fetchFilingsList(inv.cik);
      setFilings(flist);
      setFilIdx(0);
      const res=await fetchFilingData(inv.cik,flist[0]);
      setData(res);setIsLive(true);
    }catch(e){
      setLiveErr(`Live-Daten nicht verfügbar: ${e.message}. Mock-Daten werden verwendet.`);
    }finally{setLoading(false);}
  }

  async function onFilingChange(e){
    const idx=Number(e.target.value);
    setFilIdx(idx);
    setLoading(true);setLiveErr('');
    try{
      const res=await fetchFilingData(inv.cik,filings[idx]);
      setData(res);
    }catch(e){
      setLiveErr(`Fehler: ${e.message}`);
    }finally{setLoading(false);}
  }

  const sectors=useMemo(()=>{
    if(!data?.holdings)return[];
    const m={};
    data.holdings.forEach(h=>{if(h.chg!=='sold'){const s=h.sector||'Sonstiges';m[s]=(m[s]||0)+h.value;}});
    return Object.entries(m).map(([n,v])=>({name:n,value:v,color:SC[n]||SC['Sonstiges']})).sort((a,b)=>b.value-a.value);
  },[data]);

  const sorted=useMemo(()=>{
    if(!data?.holdings)return[];
    return[...data.holdings].sort((a,b)=>{
      let va=a[sortCol]??0,vb=b[sortCol]??0;
      if(typeof va==='string'){va=va.toLowerCase();vb=vb.toLowerCase();}
      return sortAsc?(va>vb?1:va<vb?-1:0):(va<vb?1:va>vb?-1:0);
    });
  },[data,sortCol,sortAsc]);

  function sort(col){if(sortCol===col)setSortAsc(!sortAsc);else{setSortCol(col);setSortAsc(false);}}
  function sArrow(col){if(sortCol!==col)return'';return sortAsc?' ↑':' ↓';}

  const active=sorted.filter(h=>h.chg!=='sold');
  const tv=data?.totalValue||0;
  const top1=active[0];

  return(
    <div>
      {/* Header */}
      <div className="hdr">
        <div>
          <div className="title">📊 Guru Portfolio Tracker</div>
          <div className="subtitle">Basierend auf SEC 13F-HR Filings · EDGAR</div>
        </div>
        <div className="sel-wrap">
          <select value={selId} onChange={e=>setSelId(e.target.value)}>
            {INVESTORS.map(x=>(
              <option key={x.id} value={x.id}>{x.name} — {x.mgr}</option>
            ))}
          </select>
        </div>
        <button className="btn btn-primary" onClick={loadLive} disabled={loading}>
          {loading?'Lädt…':'🔄 Live laden'}
        </button>
        <button className={`btn-chart${showChart?' active':''}`} onClick={()=>setShowChart(!showChart)}>
          {showChart?'⬆ Chart':'📈 Performance'}
        </button>
        <span className={`badge ${isLive?'badge-live':'badge-mock'}`}>{isLive?'LIVE':'MOCK'}</span>
      </div>

      {liveErr&&<div className="warn">⚠️ {liveErr}</div>}
      {isLive&&<div className="warn" style={{background:'#0d1a10',borderColor:'#0e4030',color:'#5a8a6a'}}>
        ℹ️ Live-Daten enthalten keine Quartals-Vergleiche (▲▼). SEC-Filings melden keine Tickers — Holdings nach Firmenname.
      </div>}

      {/* Filing selector (live mode, multiple filings) */}
      {isLive&&filings.length>1&&(
        <div className="fil-row">
          <span className="fil-lbl">📅 Quartal</span>
          <select className="fil-sel" value={filIdx} onChange={onFilingChange} disabled={loading}>
            {filings.map((f,i)=>(
              <option key={i} value={i}>{fperiod(f.period)} · {f.filingDate}</option>
            ))}
          </select>
          <span className="fil-count">{filings.length} Filings verfügbar</span>
        </div>
      )}

      {/* Performance chart */}
      {showChart&&(
        <div className="chart-wrap">
          <div className="chart-hdr">
            <span className="chart-ttl">📈 Portfolio vs. S&P 500</span>
            <div className="rng-btns">
              {['6m','1y','2y','5y'].map(r=>(
                <button key={r} className={`rng-btn${chartRange===r?' active':''}`} onClick={()=>setChartRange(r)}>
                  {r.toUpperCase()}
                </button>
              ))}
            </div>
          </div>
          <PerfChart selId={selId} range={chartRange}/>
        </div>
      )}

      {loading&&<div className="spin"/>}

      {!loading&&data&&(
        <>
          {/* Summary cards */}
          <div className="cards">
            <div className="card">
              <div className="card-lbl">Portfolio-Wert</div>
              <div className="card-val">{fmv(tv)}</div>
              <div className="card-sub">{data.period||'–'}</div>
            </div>
            <div className="card">
              <div className="card-lbl">Positionen</div>
              <div className="card-val">{active.length}</div>
              <div className="card-sub">im 13F gemeldet</div>
            </div>
            <div className="card">
              <div className="card-lbl">Größte Position</div>
              <div className="card-val" style={{fontSize:'13px'}}>{top1?.ticker||top1?.name?.split(' ')[0]||'–'}</div>
              <div className="card-sub">{tv&&top1?(top1.value/tv*100).toFixed(1)+'%':''} des Portfolios</div>
            </div>
            <div className="card">
              <div className="card-lbl">Strategie</div>
              <div className="card-val" style={{fontSize:'12px'}}>{inv.style}</div>
              <div className="card-sub">Filing: {data.filingDate||data.period||'–'}</div>
            </div>
          </div>

          {/* Layout */}
          <div className="layout">
            <div className="tbl-wrap">
              <table>
                <thead>
                  <tr>
                    <th className={`left${sortCol==='ticker'?' sorted':''}`} onClick={()=>sort('ticker')}>
                      Ticker{sArrow('ticker')}
                    </th>
                    <th className={`left${sortCol==='name'?' sorted':''}`} onClick={()=>sort('name')}>
                      Unternehmen{sArrow('name')}
                    </th>
                    <th className={`left col-sector${sortCol==='sector'?' sorted':''}`} onClick={()=>sort('sector')}>
                      Sektor{sArrow('sector')}
                    </th>
                    <th className={sortCol==='value'?'sorted':''} onClick={()=>sort('value')}>
                      Wert{sArrow('value')}
                    </th>
                    <th className="col-pct">Anteil</th>
                    <th className={`col-shares${sortCol==='shares'?' sorted':''}`} onClick={()=>sort('shares')}>
                      Aktien{sArrow('shares')}
                    </th>
                    <th>Veränd.</th>
                  </tr>
                </thead>
                <tbody>
                  {sorted.map((h,i)=>(
                    <tr key={i} style={h.chg==='sold'?{opacity:.45}:{}}>
                      <td className="left">
                        <span className="tkr">{h.ticker||'—'}</span>
                      </td>
                      <td className="left col-name" style={{maxWidth:'170px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'#c4cfe0'}}>
                        {h.name}
                      </td>
                      <td className="left col-sector">
                        <span className="dot" style={{background:SC[h.sector]||SC['Sonstiges'],width:'6px',height:'6px',marginRight:'5px'}}/>
                        {h.sector}
                      </td>
                      <td style={{fontWeight:600,color:'#e8eeff'}}>{fmv(h.value)}</td>
                      <td className="col-pct" style={{color:'#8a9bb5'}}>{tv?(h.value/tv*100).toFixed(1)+'%':'–'}</td>
                      <td className="col-shares" style={{color:'#6b7a99'}}>{fsh(h.shares)}</td>
                      <td><Chg chg={h.chg} pct={h.chgPct}/></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            <div className="sidebar">
              <div className="panel">
                <div className="panel-ttl">Sektorverteilung</div>
                <DonutChart sectors={sectors}/>
                <ul className="legend" style={{marginTop:'8px'}}>
                  {(()=>{const st=sectors.reduce((a,x)=>a+x.value,0);return sectors.map((s,i)=>(
                    <li key={i}>
                      <span className="dot" style={{background:s.color,width:'7px',height:'7px'}}/>
                      <span>{s.name}</span>
                      <span className="legend-pct">{(s.value/st*100).toFixed(0)}%</span>
                    </li>
                  ));})()}
                </ul>
              </div>
              <div className="panel">
                <div className="panel-ttl">Investor Info</div>
                <div className="irow"><span className="ik">Manager</span><span className="iv">{inv.mgr}</span></div>
                <div className="irow"><span className="ik">Fonds</span><span className="iv">{inv.name}</span></div>
                <div className="irow"><span className="ik">Strategie</span><span className="iv">{inv.style}</span></div>
                <div className="irow">
                  <span className="ik">SEC CIK</span>
                  <span className="iv" style={{fontFamily:'monospace',fontSize:'10px'}}>{inv.cik}</span>
                </div>
                <div className="irow"><span className="ik">Periode</span><span className="iv">{data.period||'–'}</span></div>
                <div className="irow"><span className="ik">Quelle</span><span className="iv">{isLive?'SEC EDGAR Live':'Mock-Daten'}</span></div>
              </div>
              <div className="panel" style={{fontSize:'10px',color:'#3a4a60',lineHeight:'1.6'}}>
                <span className="chg-new">★ Neu</span> neue Position &nbsp;
                <span className="chg-inc">▲</span> aufgestockt &nbsp;
                <span className="chg-hld">—</span> unverändert &nbsp;
                <span className="chg-red">▼</span> reduziert
              </div>
            </div>
          </div>

          <div className="disc">
            13F-Filings erfassen nur US-börsennotierte Wertpapiere ab $100M Meldepflicht-Schwellenwert.
            Verzug: bis zu 45 Tage nach Quartalsende. Keine Shorts, Anleihen oder internationale Positionen.
            Keine Anlageberatung.
          </div>
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
