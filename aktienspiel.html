<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#dde4f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:14px 12px;min-height:100vh}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;padding:7px 14px;transition:all .15s;white-space:nowrap;line-height:1.4}
.btn-primary{background:linear-gradient(135deg,#0e7a63,#00c9a7);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid #2a3854;color:#8a9bb5}
.btn-ghost:hover{border-color:#00c9a7;color:#00c9a7}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.btn-save{background:transparent;border:1px solid #1e4a3a;color:#00c9a7}
.btn-save:hover{background:#0e2d22;border-color:#00c9a7}
.btn-icon{background:transparent;border:1px solid #1e2d47;border-radius:6px;color:#6b7a99;cursor:pointer;font-size:13px;padding:4px 8px;transition:all .15s}
.btn-icon:hover{border-color:#00c9a7;color:#00c9a7}
.btn-del{background:transparent;border:1px solid #1e2d47;border-radius:6px;color:#6b7a99;cursor:pointer;font-size:13px;padding:4px 8px;transition:all .15s}
.btn-del:hover{border-color:#ff4757;color:#ff4757}
input,select{background:#0a0f1e;border:1px solid #2a3854;border-radius:8px;color:#dde4f0;font-size:13px;padding:8px 10px;width:100%;transition:.15s}
input:focus,select:focus{border-color:#00c9a7;outline:none;box-shadow:0 0 0 3px rgba(0,201,167,.1)}
input::placeholder{color:#3a4a60}
label{color:#6b7a99;display:block;font-size:11px;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.green{color:#00c9a7}
.red{color:#ff4757}
.muted{color:#6b7a99}
.overlay{align-items:center;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);bottom:0;display:flex;justify-content:center;left:0;position:fixed;right:0;top:0;z-index:50}
.modal{background:#111827;border:1px solid #1e2d47;border-radius:16px;max-height:92vh;overflow-y:auto;padding:24px;width:min(380px,94vw)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:18px}
.fg{margin-bottom:12px}
.card{background:#111827;border:1px solid #1e2d47;border-radius:12px}
table{border-collapse:collapse;font-size:12px;width:100%}
th{border-bottom:1px solid #1e2d47;color:#566380;font-size:10px;font-weight:700;letter-spacing:.6px;padding:8px 10px;text-align:right;text-transform:uppercase;white-space:nowrap}
th:first-child,th.left{text-align:left}
td{border-bottom:1px solid #0f1626;padding:10px;text-align:right;vertical-align:middle}
td:first-child,td.left{text-align:left}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.015)}
.badge{background:#1a2844;border-radius:5px;color:#00c9a7;display:inline-block;font-family:'SF Mono',SFMono-Regular,Consolas,monospace;font-size:12px;font-weight:700;padding:2px 7px}
.sumcard{background:#111827;border:1px solid #1e2d47;border-radius:10px;padding:14px 16px}
.sum-label{color:#566380;font-size:10px;font-weight:700;letter-spacing:.6px;margin-bottom:5px;text-transform:uppercase}
.sum-val{font-size:20px;font-weight:700;line-height:1}
.bar-track{background:#1a2844;border-radius:3px;height:3px;margin-top:4px;overflow:hidden;width:56px}
.bar-fill{background:#00c9a7;border-radius:3px;height:100%;transition:width .4s}
.spinner{animation:spin .9s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px 0;text-align:center}
.err{background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.25);border-radius:6px;color:#ff4757;font-size:12px;margin-top:8px;padding:8px 10px}
.tag{background:#182234;border-radius:4px;color:#8a9bb5;font-size:10px;padding:2px 6px}
.toast{background:#0e2d22;border:1px solid #00c9a7;border-radius:8px;color:#00c9a7;font-size:12px;font-weight:600;left:50%;padding:8px 16px;position:fixed;top:14px;transform:translateX(-50%);z-index:100;animation:fadein .2s}
.toast.err-toast{background:#2d0e0e;border-color:#ff4757;color:#ff4757}
@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.warn{background:rgba(255,152,0,.07);border:1px solid rgba(255,152,0,.2);border-radius:6px;color:#ff9800;font-size:11px;padding:6px 10px;margin-bottom:10px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const SK='spiel_depot_v2';

/* ── Formatierung ── */
const de=(n,d=2)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,fallback='–')=>n==null||isNaN(n)?fallback:`${n>=0?'+':''}${de(n)}%`;
const diff=(n,c='€')=>n==null||isNaN(n)?'–':`${n>=0?'+':''}${de(n)} ${c}`;
const abs=(n,c='€')=>n==null||isNaN(n)?'–':`${de(n)} ${c}`;
const clr=(n)=>!n||isNaN(n)?'muted':n>0?'green':'red';
const uid=()=>Math.random().toString(36).slice(2,9);
const ccySym=(c)=>c==='GBP'?'£':c==='USD'?'$':'€';

/* ── Yahoo Finance v8 Chart ── */
async function getQuote(ticker){
  const t=ticker.trim().toUpperCase();
  for(const base of['query1','query2']){
    try{
      const r=await fetch(`https://${base}.finance.yahoo.com/v8/finance/chart/${t}?interval=1d&range=5d`,
        {headers:{Accept:'application/json'},signal:AbortSignal.timeout(8000)});
      if(!r.ok) continue;
      const j=await r.json();
      const m=(j.chart?.result||[])[0]?.meta;
      if(!m) continue;
      const p=m.regularMarketPrice??m.chartPreviousClose;
      if(p==null) continue;
      return{ticker:t,price:p,prev:m.chartPreviousClose||m.regularMarketPreviousClose||p,
        currency:m.currency||'USD',name:m.longName||m.shortName||t};
    }catch(e){}
  }
  throw new Error(`${t}: Kurs nicht abrufbar`);
}

/* ── Modal ── */
function PosModal({initial,onSave,onClose}){
  const isEdit=!!initial?.id;
  const[f,setF]=useState({
    ticker:initial?.ticker||'',
    shares:initial?.shares!=null?String(initial.shares):'',
    buyPrice:initial?.buyPrice!=null?String(initial.buyPrice):'',
    buyDate:initial?.buyDate||new Date().toISOString().slice(0,10),
    note:initial?.note||'',
  });
  const[busy,setBusy]=useState(false);
  const[err,setErr]=useState('');
  const set=(k)=>(e)=>setF(p=>({...p,[k]:e.target.value}));

  /* Close on ESC */
  useEffect(()=>{
    const h=(e)=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return()=>window.removeEventListener('keydown',h);
  },[onClose]);

  async function submit(e){
    e.preventDefault();
    const shares=parseFloat(f.shares);
    const buyPrice=parseFloat(f.buyPrice);
    if(!f.ticker.trim()&&!isEdit){setErr('Ticker eingeben.');return;}
    if(!shares||shares<=0){setErr('Anzahl muss größer 0 sein.');return;}
    if(!buyPrice||buyPrice<=0){setErr('Kaufkurs muss größer 0 sein.');return;}
    if(!f.buyDate){setErr('Kaufdatum wählen.');return;}
    setBusy(true);setErr('');
    if(isEdit){
      /* Edit: only update mutable fields, keep existing currentPrice */
      onSave({...initial,shares,buyPrice,buyDate:f.buyDate,note:f.note,ts:Date.now()});
      onClose();setBusy(false);return;
    }
    try{
      const q=await getQuote(f.ticker);
      onSave({id:uid(),ticker:q.ticker,name:q.name,shares,buyPrice,buyDate:f.buyDate,
              note:f.note,currentPrice:q.price,currency:q.currency,ts:Date.now()});
      onClose();
    }catch(e){setErr(String(e.message||e));}
    setBusy(false);
  }

  return(
    <div className="overlay" onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={isEdit?'Position bearbeiten':'Position hinzufügen'}>
        <div className="modal-title">{isEdit?'✏️ Position bearbeiten':'➕ Position hinzufügen'}</div>
        <form onSubmit={submit}>
          <div className="fg">
            <label>Ticker-Symbol</label>
            <input placeholder="z.B. AAPL · MSFT · SAP.DE · NOVO-B.CO"
              value={f.ticker} onChange={set('ticker')} autoFocus disabled={isEdit}
              style={isEdit?{opacity:.5}:{}} />
          </div>
          <div className="fg">
            <label>Anzahl Aktien</label>
            <input type="number" placeholder="10" min="0.0001" step="any"
              value={f.shares} onChange={set('shares')} />
          </div>
          <div className="fg">
            <label>Kaufkurs</label>
            <input type="number" placeholder="150.00" min="0.0001" step="any"
              value={f.buyPrice} onChange={set('buyPrice')} />
          </div>
          <div className="fg">
            <label>Kaufdatum</label>
            <input type="date" value={f.buyDate} onChange={set('buyDate')} />
          </div>
          <div className="fg">
            <label>Notiz (optional)</label>
            <input placeholder="z.B. Langfristposition" value={f.note} onChange={set('note')} />
          </div>
          {err&&<div className="err">{err}</div>}
          <div style={{display:'flex',gap:'8px',marginTop:'14px'}}>
            <button className="btn btn-primary" style={{flex:1}} disabled={busy}>
              {busy?<><span className="spinner">↻</span> Prüfe Kurs…</>
                  :(isEdit?'Speichern':'Hinzufügen')}
            </button>
            <button type="button" className="btn btn-ghost" onClick={onClose}>Abbrechen</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ── Speichern-Toast ── */
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[onDone]);
  return <div className={`toast${type==='err'?' err-toast':''}`}>{msg}</div>;
}

/* ── Haupt-App ── */
function App(){
  const[pos,setPos]=useState([]);
  const[ready,setReady]=useState(false);  // true after initial load
  const[modal,setModal]=useState(null);
  const[refreshing,setRefreshing]=useState(false);
  const[upd,setUpd]=useState(null);
  const[toast,setToast]=useState(null);
  const refreshingRef=useRef(false);

  const showToast=(msg,type='ok')=>setToast({msg,type,key:Date.now()});

  /* ── Initial load: localStorage → merge with server data ── */
  useEffect(()=>{
    let loaded=[];
    try{
      const s=localStorage.getItem(SK);
      if(s){const d=JSON.parse(s);if(Array.isArray(d))loaded=d;}
    }catch(e){}
    /* Server-injected initial data (from Railway Volume via Streamlit) */
    try{
      const srv=window.__SPIEL_INIT__;
      if(Array.isArray(srv)&&srv.length){
        if(!loaded.length){
          loaded=srv;  /* localStorage empty → use server data */
        } else {
          /* Merge: add server positions not in localStorage */
          const ids=new Set(loaded.map(p=>p.id));
          const extra=srv.filter(p=>!ids.has(p.id));
          if(extra.length) loaded=[...loaded,...extra];
        }
      }
    }catch(e){}
    setPos(loaded);
    setReady(true);
  },[]);

  /* ── Persist to localStorage ── */
  useEffect(()=>{
    if(!ready) return;
    localStorage.setItem(SK,JSON.stringify(pos));
  },[pos,ready]);

  /* ── Refresh prices ── */
  const refresh=useCallback(async(current)=>{
    if(!current.length||refreshingRef.current) return;
    refreshingRef.current=true;
    setRefreshing(true);
    let failed=0;
    const next=await Promise.all(current.map(async p=>{
      try{const q=await getQuote(p.ticker);
        return{...p,currentPrice:q.price,currency:q.currency,name:q.name,ts:Date.now()};}
      catch(e){failed++;return p;}
    }));
    setPos(next);setUpd(new Date());
    if(failed>0) showToast(`⚠️ ${failed} Kurs${failed>1?'e':''} nicht aktualisiert`,'err');
    refreshingRef.current=false;
    setRefreshing(false);
  },[]);

  /* ── Auto-refresh on mount + every 60s ── */
  const posRef=useRef(pos);
  useEffect(()=>{posRef.current=pos;},[pos]);
  useEffect(()=>{
    if(posRef.current.length) refresh(posRef.current);
    const t=setInterval(()=>refresh(posRef.current),60000);
    return()=>clearInterval(t);
  },[refresh]);

  function upsert(p){
    setPos(prev=>{const i=prev.findIndex(x=>x.id===p.id);
      if(i>=0){const n=[...prev];n[i]=p;return n;}return[...prev,p];});
  }
  function del(id){
    if(!window.confirm('Position löschen?')) return;
    setPos(p=>p.filter(x=>x.id!==id));
  }

  /* ── Auf Server sichern ── */
  function saveToServer(){
    const data=btoa(unescape(encodeURIComponent(JSON.stringify(pos))));
    /* Try to navigate parent Streamlit page with save param */
    try{
      const url=new URL(window.parent.location.href);
      url.searchParams.set('spiel_save',data);
      window.parent.location.href=url.toString();
    }catch(e){
      /* Fallback: copy to clipboard */
      try{
        navigator.clipboard.writeText(JSON.stringify(pos,null,2));
        showToast('📋 JSON kopiert — oben im Textfeld einfügen & speichern');
      }catch(e2){
        showToast('Speichern fehlgeschlagen — bitte Seite neu laden','err');
      }
    }
  }

  /* ── Berechnungen ── */
  /* Group by currency for correct totals */
  const byCcy={};
  pos.forEach(p=>{
    const c=p.currency||'USD';
    if(!byCcy[c]) byCcy[c]={buy:0,cur:0};
    const cur=p.currentPrice??p.buyPrice;
    byCcy[c].buy+=p.buyPrice*p.shares;
    byCcy[c].cur+=cur*p.shares;
  });
  const ccys=Object.keys(byCcy);
  const singleCcy=ccys.length<=1;
  /* Use first / only currency for summary cards */
  const mainCcy=ccys[0]||'EUR';
  const mainSym=ccySym(mainCcy);
  const totalBuy=singleCcy?(byCcy[mainCcy]?.buy||0):null;
  const totalCur=singleCcy?(byCcy[mainCcy]?.cur||0):null;
  const totalGain=totalBuy!=null&&totalCur!=null?totalCur-totalBuy:null;
  const totalGainPct=totalBuy?totalGain/totalBuy*100:null;

  const sortedPos=[...pos].sort((a,b)=>{
    const va=(a.currentPrice??a.buyPrice)*a.shares;
    const vb=(b.currentPrice??b.buyPrice)*b.shares;
    return vb-va;
  });
  const grandCur=pos.reduce((s,p)=>s+(p.currentPrice??p.buyPrice)*p.shares,0)||1;

  /* ── Render ── */
  if(!ready) return <div className="muted" style={{padding:'32px',textAlign:'center'}}>Lädt…</div>;

  return(
    <>
    {toast&&<Toast key={toast.key} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}

    {/* Summary */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(148px,1fr))',gap:'10px',marginBottom:'14px'}}>
      {singleCcy?[
        {l:'Depot-Wert',v:abs(totalCur,mainSym),c:''},
        {l:'Einstand',v:abs(totalBuy,mainSym),c:''},
        {l:'Gewinn / Verlust',v:diff(totalGain,mainSym),c:clr(totalGain)},
        {l:'Performance',v:pct(totalGainPct),c:clr(totalGainPct)},
      ].map(({l,v,c})=>(
        <div className="sumcard" key={l}>
          <div className="sum-label">{l}</div>
          <div className={`sum-val ${c}`}>{v}</div>
        </div>
      )):(
        ccys.map(c=>{
          const g=byCcy[c].cur-byCcy[c].buy;
          const gp=byCcy[c].buy?g/byCcy[c].buy*100:null;
          const sym=ccySym(c);
          return(
            <div className="sumcard" key={c}>
              <div className="sum-label">Depot {c}</div>
              <div className="sum-val">{abs(byCcy[c].cur,sym)}</div>
              <div className={`${clr(g)}`} style={{fontSize:'13px',marginTop:'4px'}}>
                {diff(g,sym)} ({pct(gp,'–')})
              </div>
            </div>
          );
        })
      )}
    </div>

    {!singleCcy&&(
      <div className="warn">
        ⚠️ Depot enthält Positionen in verschiedenen Währungen ({ccys.join(', ')}).
        Gesamtperformance wird je Währung separat angezeigt — kein Kurs-Umrechnung.
      </div>
    )}

    {/* Toolbar */}
    <div style={{alignItems:'center',display:'flex',flexWrap:'wrap',gap:'8px',justifyContent:'space-between',marginBottom:'12px'}}>
      <span className="muted" style={{fontSize:'11px'}}>
        {upd&&`↺ ${upd.toLocaleTimeString('de-DE')}  `}
        {pos.length>0&&<span className="tag">{pos.length} Position{pos.length!==1?'en':''}</span>}
      </span>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        {pos.length>0&&<>
          <button className="btn btn-ghost" onClick={()=>refresh(pos)} disabled={refreshing}
            style={{fontSize:'12px',padding:'6px 12px'}} aria-label="Kurse aktualisieren">
            <span className={refreshing?'spinner':''} style={{display:'inline-block',marginRight:'5px'}}>↻</span>
            {refreshing?'Lädt…':'Kurse'}
          </button>
          <button className="btn btn-save" onClick={saveToServer}
            style={{fontSize:'12px',padding:'6px 12px'}} aria-label="Auf Server speichern">
            ☁️ Speichern
          </button>
        </>}
        <button className="btn btn-primary" onClick={()=>setModal('new')}
          style={{fontSize:'12px',padding:'6px 12px'}} aria-label="Position hinzufügen">
          ＋ Position
        </button>
      </div>
    </div>

    {/* Table */}
    <div className="card" style={{overflowX:'auto'}}>
      {pos.length===0?(
        <div className="empty">
          <div style={{fontSize:'36px',marginBottom:'10px',opacity:.2}}>📊</div>
          <div className="muted" style={{marginBottom:'16px',fontSize:'13px'}}>Noch kein Depot aufgebaut</div>
          <button className="btn btn-primary" onClick={()=>setModal('new')}>Erste Position hinzufügen</button>
        </div>
      ):(
        <table>
          <thead><tr>
            <th className="left" style={{paddingLeft:'14px'}}>Aktie</th>
            <th>Datum</th>
            <th>Stück</th>
            <th>Kaufkurs</th>
            <th>Einstand</th>
            <th>Kurs</th>
            <th>Wert</th>
            <th>+/– €/$</th>
            <th>+/– %</th>
            <th>Anteil</th>
            <th style={{paddingRight:'14px'}}></th>
          </tr></thead>
          <tbody>
          {sortedPos.map(p=>{
            const cur=p.currentPrice;
            const hasCur=cur!=null&&!isNaN(cur);
            const dispCur=hasCur?cur:p.buyPrice;
            const buyCost=p.buyPrice*p.shares;
            const curVal=dispCur*p.shares;
            const g=hasCur?curVal-buyCost:null;
            const gPct=hasCur&&buyCost>0?(curVal/buyCost-1)*100:null;
            const wt=grandCur>0?curVal/grandCur*100:0;
            const sym=ccySym(p.currency||'USD');
            return(
              <tr key={p.id}>
                <td className="left" style={{paddingLeft:'14px'}}>
                  <span className="badge">{p.ticker}</span>
                  {p.note&&<div style={{color:'#3a6050',fontSize:'10px',marginTop:'2px'}}>{p.note}</div>}
                  {!p.note&&<div style={{color:'#566380',fontSize:'10px',marginTop:'2px',maxWidth:'100px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name||''}</div>}
                </td>
                <td><span className="muted" style={{fontSize:'11px'}}>{p.buyDate}</span></td>
                <td>{de(p.shares, Number.isInteger(p.shares)?0:p.shares<10?3:2)}</td>
                <td>{de(p.buyPrice)}{' '}{sym}</td>
                <td>{de(buyCost)}{' '}{sym}</td>
                <td style={{fontWeight:600}}>
                  {hasCur?<>{de(dispCur)}{' '}{sym}</>
                    :<span className="muted" style={{fontSize:'11px'}}>–</span>}
                </td>
                <td style={{fontWeight:600}}>{de(curVal)}{' '}{sym}</td>
                <td className={clr(g)}>{diff(g,sym)}</td>
                <td className={clr(gPct)} style={{fontWeight:600}}>{pct(gPct)}</td>
                <td>
                  <div style={{alignItems:'flex-end',display:'flex',flexDirection:'column',gap:'3px'}}>
                    <span style={{fontSize:'11px'}}>{de(wt,1)}%</span>
                    <div className="bar-track"><div className="bar-fill" style={{width:`${Math.min(wt,100)}%`}}/></div>
                  </div>
                </td>
                <td style={{paddingRight:'14px'}}>
                  <div style={{display:'flex',gap:'5px',justifyContent:'flex-end'}}>
                    <button className="btn-icon" title="Bearbeiten" aria-label="Bearbeiten"
                      onClick={()=>setModal({...p,shares:String(p.shares),buyPrice:String(p.buyPrice)})}>✎</button>
                    <button className="btn-del" title="Löschen" aria-label="Löschen"
                      onClick={()=>del(p.id)}>✕</button>
                  </div>
                </td>
              </tr>
            );
          })}
          </tbody>
        </table>
      )}
    </div>

    <div style={{color:'#2a3854',fontSize:'10px',marginTop:'10px',textAlign:'center'}}>
      Kurse via Yahoo Finance · localStorage + Railway Volume · Keine Anlageberatung
    </div>

    {modal&&(
      <PosModal
        initial={modal==='new'?null:modal}
        onSave={upsert}
        onClose={()=>setModal(null)}
      />
    )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
