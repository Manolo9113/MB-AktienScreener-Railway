<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0f1e;color:#dde4f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:14px 12px;min-height:100vh}
.btn{border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;padding:7px 14px;transition:all .15s;white-space:nowrap;line-height:1.4}
.btn-primary{background:linear-gradient(135deg,#0e7a63,#00c9a7);color:#fff}
.btn-primary:hover{filter:brightness(1.12)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid #2a3854;color:#8a9bb5}

.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.btn-save{background:transparent;border:1px solid #1e4a3a;color:#00c9a7}
.btn-save:hover{background:#0e2d22;border-color:#00c9a7}
.btn-icon{background:transparent;border:1px solid #1e2d47;border-radius:6px;color:#6b7a99;cursor:pointer;font-size:13px;padding:4px 8px;transition:all .15s}
.btn-icon:hover{border-color:#00c9a7;color:#00c9a7}
.btn-del{background:transparent;border:1px solid #1e2d47;border-radius:6px;color:#6b7a99;cursor:pointer;font-size:13px;padding:4px 8px;transition:all .15s}

input:focus,select:focus{border-color:#00c9a7;outline:none;box-shadow:0 0 0 3px rgba(0,201,167,.1)}
input::placeholder{color:#3a4a60}
label{color:#6b7a99;display:block;font-size:11px;letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
.green{color:#00c9a7}
.red{color:#ff4757}
.muted{color:#6b7a99}
.overlay{align-items:center;background:rgba(0,0,0,.8);backdrop-filter:blur(6px);bottom:0;display:flex;justify-content:center;left:0;position:fixed;right:0;top:0;z-index:50}

th:first-child,th.left{text-align:left}

.sumcard{background:#111827;border:1px solid #1e2d47;border-radius:10px;padding:14px 16px}

.sum-val{font-size:20px;font-weight:700;line-height:1}
.bar-track{background:#1a2844;border-radius:3px;height:3px;margin-top:4px;overflow:hidden;width:56px}
.bar-fill{background:#00c9a7;border-radius:3px;height:100%;transition:width .4s}
.spinner{animation:spin .9s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{padding:40px 0;text-align:center}
.err{background:rgba(255,71,87,.08);border:1px solid rgba(255,71,87,.25);border-radius:6px;color:#ff4757;font-size:12px;margin-top:8px;padding:8px 10px}
.tag{background:#182234;border-radius:4px;color:#8a9bb5;font-size:10px;padding:2px 6px}
.toast{background:#0e2d22;border:1px solid #00c9a7;border-radius:8px;color:#00c9a7;font-size:12px;font-weight:600;left:50%;padding:8px 16px;position:fixed;top:14px;transform:translateX(-50%);z-index:100;animation:fadein .2s}

@keyframes fadein{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.chart-wrap{background:#111827;border:1px solid #1e2d47;border-radius:12px;padding:14px;margin-bottom:14px}
.chart-hdr{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chart-ttl{color:#8a9bb5;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.rng-btns{display:flex;gap:4px}
.rng-btn{border:1px solid #2a3854;background:transparent;color:#6b7a99;border-radius:5px;font-size:10px;padding:3px 9px;cursor:pointer;transition:.15s}
.rng-btn.active{background:rgba(0,201,167,.15);border-color:#00c9a7;color:#00c9a7}
.rng-btn:hover{border-color:#00c9a7;color:#00c9a7}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
/* Server-injected data (replaced by Python/Streamlit) */
if(typeof window.__SPIEL_INIT__==='undefined') window.__SPIEL_INIT__=[];
if(typeof window.__AI_PORTFOLIO__==='undefined') window.__AI_PORTFOLIO__={"positions":[],"generated_at":null,"budget":50000};
if(typeof window.__FMP_KEY__==='undefined') window.__FMP_KEY__='';

const{useState,useEffect,useCallback,useRef,useMemo}=React;
const SK='spiel_depot_v2';

/* ── Formatierung ── */
const de=(n,d=2)=>n==null||isNaN(n)?'–':Number(n).toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
const pct=(n,fallback='–')=>n==null||isNaN(n)?fallback:`${n>=0?'+':''}${de(n)}%`;
const diff=(n,c='€')=>n==null||isNaN(n)?'–':`${n>=0?'+':''}${de(n)} ${c}`;
const abs=(n,c='€')=>n==null||isNaN(n)?'–':`${de(n)} ${c}`;
const clr=(n)=>!n||isNaN(n)?'muted':n>0?'green':'red';
const uid=()=>Math.random().toString(36).slice(2,9);
const ccySym=(c)=>c==='GBP'?'£':c==='USD'?'$':'€';

/* ── AbortSignal.timeout Polyfill (iOS < 15.4) ── */
function mkSignal(ms){
  if(typeof AbortSignal!=='undefined'&&AbortSignal.timeout)return AbortSignal.timeout(ms);
  const c=new AbortController();setTimeout(()=>c.abort(),ms);return c.signal;
}

/* ── Yahoo Finance v8 + FMP Fallback ── */
async function getQuote(ticker){
  const t=ticker.trim().toUpperCase();
  for(const base of['query1','query2']){
    try{
      const r=await fetch(`https://${base}.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t)}?interval=1d&range=5d`,
        {headers:{Accept:'application/json'},signal:mkSignal(8000)});
      if(!r.ok) continue;
      const j=await r.json();
      const m=(j.chart?.result||[])[0]?.meta;
      if(!m) continue;
      const p=m.regularMarketPrice??m.chartPreviousClose;
      if(p==null) continue;
      return{ticker:t,price:p,prev:m.chartPreviousClose||m.regularMarketPreviousClose||p,
        currency:m.currency||'USD',name:m.longName||m.shortName||t,
        quoteType:(m.instrumentType||m.quoteType||'').toUpperCase()};
    }catch(e){}
  }
  /* FMP Fallback */
  const fk=window.__FMP_KEY__||'';
  if(fk){
    try{
      const r=await fetch(
        `https://financialmodelingprep.com/api/v3/quote/${encodeURIComponent(t)}?apikey=${fk}`,
        {signal:mkSignal(10000)});
      if(r.ok){
        const data=await r.json();
        const q=data[0];
        if(q&&q.price){
          return{ticker:t,price:q.price,prev:q.previousClose||q.price,
            currency:q.currency||'USD',name:q.name||t,quoteType:'EQUITY'};
        }
      }
    }catch(e){}
  }
  throw new Error(`${t}: Kurs nicht abrufbar`);
}

/* ── FMP Profil: ISIN / WKN / Name ── */
async function fetchFmpProfile(ticker){
  const fk=window.__FMP_KEY__||'';
  if(!fk)return null;
  try{
    const r=await fetch(
      `https://financialmodelingprep.com/api/v3/profile/${encodeURIComponent(ticker)}?apikey=${fk}`,
      {signal:mkSignal(10000)});
    if(!r.ok)return null;
    const data=await r.json();
    const p=data[0];
    if(!p)return null;
    const isin=p.isin||'';
    const wkn=isin.startsWith('DE')&&isin.length===12?isin.slice(5,11):'';
    return{isin,wkn,name:p.companyName||''};
  }catch(e){return null;}
}

/* ── Instrument-Typ Validierung ── */
const _ALLOWED_QUOTE_TYPES=new Set(['EQUITY','ETF','MUTUALFUND','FUND','REIT']);
const _BLOCKED_LABELS={
  WARRANT:'Optionsschein / Warrant',OPTION:'Option',FUTURE:'Future / Terminkontrakt',
  CRYPTOCURRENCY:'Kryptowährung',INDEX:'Index (nicht direkt handelbar)',
  CURRENCY:'Devisenpaar',MONEYMARKET:'Geldmarktfonds',
};
function checkQuoteType(quoteType,name){
  if(!quoteType)return null;
  if(_ALLOWED_QUOTE_TYPES.has(quoteType))return null;
  const label=_BLOCKED_LABELS[quoteType]||quoteType;
  return`❌ ${name||'Dieses Instrument'} ist ein ${label}. Im Aktienspiel sind nur Aktien und ETFs erlaubt.`;
}

/* ── Yahoo monthly chart data ── */
async function fetchYahooChart(ticker,range){
  const yRange={'6m':'6mo','1y':'1y','2y':'2y','5y':'5y'}[range]||'1y';
  const t=ticker.trim().toUpperCase();
  for(const base of['query1','query2']){
    try{
      const res=await fetch(
        `https://${base}.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(t)}?interval=1mo&range=${yRange}`,
        {headers:{Accept:'application/json'},signal:AbortSignal.timeout(10000)}
      );
      if(!res.ok)continue;
      const j=await res.json();
      const result=j.chart?.result?.[0];
      if(!result)continue;
      const timestamps=(result.timestamp||[]).map(ts=>ts*1000);
      const prices=result.indicators?.adjclose?.[0]?.adjclose||result.indicators?.quote?.[0]?.close||[];
      return{ticker:t,timestamps,prices};
    }catch(e){}
  }
  throw new Error(`${t}: Kursverlauf nicht abrufbar`);
}

/* ── Portfolio Performance Chart ── */
function PortPerfChart({myPositions,aiPositions,range}){
  const[st,setSt]=useState({loading:false,err:'',series:null});

  const myKey=useMemo(()=>(myPositions||[]).map(p=>p.ticker).sort().join('|'),[myPositions]);
  const aiKey=useMemo(()=>(aiPositions||[]).map(p=>p.ticker).sort().join('|'),[aiPositions]);

  useEffect(()=>{
    const myH=(myPositions||[]).filter(p=>p.ticker&&(p.currentPrice||p.buyPrice)>0);
    const aiH=(aiPositions||[]).filter(p=>p.ticker&&(p.currentPrice||p.buyPrice)>0);
    if(!myH.length&&!aiH.length){
      setSt({loading:false,err:'Noch keine Positionen mit Kursdaten vorhanden',series:null});
      return;
    }
    let done=false;
    setSt({loading:true,err:'',series:null});

    const allT=[...new Set([...myH.map(p=>p.ticker),...aiH.map(p=>p.ticker),'^GSPC'])];

    function norm(timestamps,prices){
      const v=[];
      for(let i=0;i<timestamps.length;i++){
        const p=prices[i];
        if(p!=null&&!isNaN(p)&&p>0)v.push({t:timestamps[i],p});
      }
      if(v.length<2)return null;
      const b=v[0].p;
      return v.map(x=>({t:x.t,ret:(x.p/b-1)*100}));
    }

    function build(holdings,spxS,td){
      const tot=holdings.reduce((s,h)=>s+(h.currentPrice||h.buyPrice)*h.shares,0);
      if(!tot)return null;
      const hn=[];
      holdings.forEach(h=>{
        const d=td[h.ticker];if(!d)return;
        const ns=norm(d.timestamps,d.prices);if(!ns)return;
        hn.push({ns,w:(h.currentPrice||h.buyPrice)*h.shares/tot});
      });
      if(!hn.length)return null;
      const series=spxS.map(({t})=>{
        let sr=0,sw=0;
        hn.forEach(({ns,w})=>{
          let best=ns[0];
          for(const p of ns)if(Math.abs(p.t-t)<Math.abs(best.t-t))best=p;
          sr+=best.ret*w;sw+=w;
        });
        return sw>0.05?{t,ret:sr/sw}:null;
      }).filter(Boolean);
      if(series.length>0){const b0=series[0].ret;series.forEach(p=>{p.ret-=b0;});}
      return series.length>=2?series:null;
    }

    Promise.allSettled(allT.map(t=>fetchYahooChart(t,range))).then(rs=>{
      if(done)return;
      const td={};allT.forEach((t,i)=>{if(rs[i].status==='fulfilled')td[t]=rs[i].value;});
      const spxData=td['^GSPC'];
      if(!spxData){setSt({loading:false,err:'S&P 500 nicht verfügbar',series:null});return;}
      const spxS=norm(spxData.timestamps,spxData.prices);
      if(!spxS){setSt({loading:false,err:'S&P 500 Daten leer',series:null});return;}
      const myS=myH.length?build(myH,spxS,td):null;
      const aiS=aiH.length?build(aiH,spxS,td):null;
      if(!myS&&!aiS){setSt({loading:false,err:'Keine Kursdaten für Portfolio-Positionen verfügbar',series:null});return;}
      setSt({loading:false,err:'',series:{myS,aiS,spxS}});
    }).catch(e=>{if(!done)setSt({loading:false,err:String(e.message||e),series:null});});

    return()=>{done=true;};
  },[myKey,aiKey,range]);

  const{loading,err,series}=st;
  if(loading)return(
    <div style={{display:'flex',alignItems:'center',gap:'8px',padding:'28px 0',color:'#566380',fontSize:'12px'}}>
      <span className="spinner" style={{fontSize:'17px',marginRight:'4px'}}>↻</span>
      Kursdaten werden geladen…
    </div>
  );
  if(err)return <div className="err">{err}</div>;
  if(!series)return null;

  const{myS,aiS,spxS}=series;
  const allPts=[...(myS||[]),...(aiS||[]),...spxS];
  const allRets=allPts.map(p=>p.ret).filter(r=>!isNaN(r));
  if(!allRets.length)return null;
  const minR=Math.min(...allRets),maxR=Math.max(...allRets);
  const pad=(maxR-minR)*0.12+2;
  const yMin=minR-pad,yMax=maxR+pad;
  const W=460,H=195,ML=42,MT=12,MR=14,MB=28;
  const cW=W-ML-MR,cH=H-MT-MB;
  const allTs=[...new Set(allPts.map(p=>p.t))].sort((a,b)=>a-b);
  const tMin=allTs[0],tMax=allTs[allTs.length-1],tR=tMax-tMin||1;
  const tx=t=>ML+(t-tMin)/tR*cW;
  const ty=r=>MT+cH-(r-yMin)/(yMax-yMin)*cH;
  const mkPath=pts=>pts.filter(p=>!isNaN(p.ret)).map((p,i)=>`${i?'L':'M'}${tx(p.t).toFixed(1)},${ty(p.ret).toFixed(1)}`).join('');
  const fmtR=r=>(r>=0?'+':'')+r.toFixed(1)+'%';
  const fmtDt=t=>new Date(t).toLocaleDateString('de-DE',{month:'short',year:'2-digit'});
  const xTicks=Array.from({length:5},(_,i)=>{
    const idx=Math.round(i*(allTs.length-1)/4);
    const t=allTs[Math.min(idx,allTs.length-1)];
    return{t,x:tx(t)};
  });
  const yTicks=Array.from({length:5},(_,i)=>{
    const r=yMin+i*(yMax-yMin)/4;
    return{r,y:ty(r)};
  });
  const zY=ty(0);
  const legs=[];
  if(myS)legs.push({c:'#00c9a7',lbl:'Mein Depot',ret:myS[myS.length-1]?.ret});
  if(aiS)legs.push({c:'#8b5cf6',lbl:'KI-Depot',ret:aiS[aiS.length-1]?.ret});
  legs.push({c:'#566380',lbl:'S&P 500',ret:spxS[spxS.length-1]?.ret});
  return(
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
        {yTicks.map(({r,y},i)=>(
          <g key={i}>
            <line x1={ML} y1={y} x2={ML+cW} y2={y} stroke="#1a2440" strokeWidth="1"/>
            <text x={ML-4} y={y+3.5} textAnchor="end" fill="#566380" fontSize="9">{r>=0?'+':''}{r.toFixed(0)}%</text>
          </g>
        ))}
        {zY>=MT&&zY<=MT+cH&&<line x1={ML} y1={zY} x2={ML+cW} y2={zY} stroke="#2a3854" strokeWidth="1.5" strokeDasharray="4,3"/>}
        {xTicks.map(({t,x},i)=>(
          <text key={i} x={x} y={H-5} textAnchor="middle" fill="#566380" fontSize="8.5">{fmtDt(t)}</text>
        ))}
        <path d={mkPath(spxS)} fill="none" stroke="#566380" strokeWidth="1.5" opacity=".8"/>
        {aiS&&<path d={mkPath(aiS)} fill="none" stroke="#8b5cf6" strokeWidth="2"/>}
        {myS&&<path d={mkPath(myS)} fill="none" stroke="#00c9a7" strokeWidth="2"/>}
        {legs.map(({c,lbl,ret},i)=>(
          <g key={i} transform={`translate(${ML+cW-115},${MT+7+i*15})`}>
            <circle cx="4" cy="4" r="4" fill={c}/>
            <text x="12" y="8" fill={c==='#566380'?'#8a9bb5':'#c4cfe0'} fontSize="9.5">
              {lbl}{ret!=null?' '+fmtR(ret):''}
            </text>
          </g>
        ))}
      </svg>
      <div style={{color:'#3a4854',fontSize:'9px',textAlign:'right',marginTop:'4px'}}>
        Kumulierte Rendite ab Startdatum · aktuelle Depot-Gewichtung · keine Anlageberatung
      </div>
    </div>
  );
}

/* ── Modal ── */
function PosModal({initial,onSave,onClose}){
  const isEdit=!!initial?.id;
  const[f,setF]=useState({
    ticker:initial?.ticker||'',
    shares:initial?.shares!=null?String(initial.shares):'',
    buyPrice:initial?.buyPrice!=null?String(initial.buyPrice):'',
    buyDate:initial?.buyDate||new Date().toISOString().slice(0,10),
    note:initial?.note||'',
  });
  const[busy,setBusy]=useState(false);
  const[fetching,setFetching]=useState(false);
  const[resolvedName,setResolvedName]=useState('');
  const[resolvedCcy,setResolvedCcy]=useState('');
  const[fmpData,setFmpData]=useState(null);
  const[suggs,setSuggs]=useState([]);
  const[err,setErr]=useState('');
  const searchTimer=useRef(null);
  const set=(k)=>(e)=>setF(p=>({...p,[k]:e.target.value}));

  /* Autocomplete: Yahoo Finance Search (kein Key) + FMP Fallback */
  function onTickerInput(e){
    const val=e.target.value;
    setF(p=>({...p,ticker:val}));
    clearTimeout(searchTimer.current);
    const q=val.trim();
    if(!q||q.length<2){setSuggs([]);return;}
    searchTimer.current=setTimeout(async()=>{
      /* Yahoo Finance Search — kein API-Key erforderlich */
      for(const base of['query1','query2']){
        try{
          const r=await fetch(
            `https://${base}.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(q)}&quotesCount=7&newsCount=0&listsCount=0`,
            {headers:{Accept:'application/json'},signal:mkSignal(5000)});
          if(!r.ok)continue;
          const data=await r.json();
          const items=(data.quotes||[])
            .filter(x=>x.symbol&&(x.quoteType==='EQUITY'||x.quoteType==='ETF')&&x.exchDisp)
            .slice(0,6)
            .map(x=>({symbol:x.symbol,name:x.shortname||x.longname||x.symbol,exchangeShortName:x.exchDisp}));
          if(items.length){setSuggs(items);return;}
        }catch(e){}
      }
      /* FMP Fallback (braucht Key) */
      const fk=window.__FMP_KEY__||'';
      if(!fk)return;
      try{
        const r=await fetch(
          `https://financialmodelingprep.com/api/v3/search?query=${encodeURIComponent(q)}&limit=8&apikey=${fk}`,
          {signal:mkSignal(5000)});
        if(!r.ok)return;
        const data=await r.json();
        setSuggs((data||[])
          .filter(x=>x.symbol&&x.name&&!['CRYPTO','FOREX','COMMODITY'].includes(x.exchangeShortName))
          .slice(0,6));
      }catch(e){}
    },350);
  }

  /* Kursdaten + FMP-Profil laden */
  async function doFetchPrice(t){
    if(!t||isEdit)return;
    setSuggs([]);
    setFetching(true);setErr('');setResolvedName('');setFmpData(null);
    try{
      const q=await getQuote(t);
      const typeErr=checkQuoteType(q.quoteType,q.name);
      if(typeErr){setErr(typeErr);setFetching(false);return;}
      setResolvedCcy(q.currency);
      setF(prev=>({...prev,ticker:q.ticker,buyPrice:prev.buyPrice||String(q.price)}));
      const fmp=await fetchFmpProfile(q.ticker);
      setFmpData(fmp);
      setResolvedName(fmp?.name||q.name);
    }catch(e){setErr(String(e.message||e));}
    setFetching(false);
  }

  /* Suggestion ausgewählt */
  function selectSugg(sym){
    setF(p=>({...p,ticker:sym}));
    setSuggs([]);
    doFetchPrice(sym);
  }

  function onTickerBlur(){
    setSuggs([]);
    doFetchPrice(f.ticker.trim());
  }

  async function submit(e){
    e.preventDefault();
    const shares=parseFloat(f.shares);
    const buyPrice=parseFloat(f.buyPrice);
    if(!f.ticker.trim()&&!isEdit){setErr('Ticker eingeben.');return;}
    if(isNaN(shares)||shares<=0){setErr('Anzahl muss größer 0 sein.');return;}
    if(isNaN(buyPrice)||buyPrice<=0){setErr('Kaufkurs muss größer 0 sein.');return;}
    if(!f.buyDate){setErr('Kaufdatum wählen.');return;}
    setBusy(true);setErr('');
    if(isEdit){
      onSave({...initial,shares,buyPrice,buyDate:f.buyDate,note:f.note,ts:Date.now()});
      onClose();setBusy(false);return;
    }
    try{
      const q=await getQuote(f.ticker);
      const typeErr=checkQuoteType(q.quoteType,q.name);
      if(typeErr){setErr(typeErr);setBusy(false);return;}
      onSave({id:uid(),ticker:q.ticker,
        name:fmpData?.name||q.name,
        isin:fmpData?.isin||'',wkn:fmpData?.wkn||'',
        shares,buyPrice,buyDate:f.buyDate,
        note:f.note,currentPrice:q.price,currency:q.currency,ts:Date.now()});
      onClose();
    }catch(e){setErr(String(e.message||e));}
    setBusy(false);
  }

  return(
    <div className="overlay" onMouseDown={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal" role="dialog" aria-modal="true" aria-label={isEdit?'Position bearbeiten':'Position hinzufügen'}>
        <div className="modal-title">{isEdit?'✏️ Position bearbeiten':'➕ Position hinzufügen'}</div>
        <form onSubmit={submit}>
          <div className="fg" style={{position:'relative'}}>
            <label>Ticker oder Firmenname</label>
            <input placeholder="z.B. Apple, AAPL, SAP, servicenow …"
              value={f.ticker} onChange={onTickerInput} onBlur={onTickerBlur}
              autoFocus disabled={isEdit} style={isEdit?{opacity:.5}:{}} />
            {suggs.length>0&&(
              <div style={{background:'#0d1525',border:'1px solid #2a3854',borderRadius:'8px',
                           boxShadow:'0 6px 18px rgba(0,0,0,.6)',left:0,marginTop:'3px',
                           overflow:'hidden',position:'absolute',right:0,zIndex:10}}>
                {suggs.map(s=>(
                  <button key={s.symbol} type="button"
                    onMouseDown={e=>{e.preventDefault();selectSugg(s.symbol);}}
                    style={{alignItems:'center',background:'transparent',border:'none',
                            borderBottom:'1px solid #1a2440',color:'#dde4f0',cursor:'pointer',
                            display:'flex',gap:'8px',padding:'9px 12px',textAlign:'left',width:'100%'}}>
                    <span style={{color:'#00c9a7',fontFamily:'monospace',fontWeight:700,minWidth:'70px'}}>{s.symbol}</span>
                    <span style={{color:'#8a9bb5',fontSize:'11px',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</span>
                    <span style={{color:'#3a4860',fontSize:'10px',flexShrink:0}}>{s.exchangeShortName}</span>
                  </button>
                ))}
              </div>
            )}
            {fetching&&<div style={{fontSize:'11px',color:'#00c9a7',marginTop:'4px'}}>
              <span className="spinner" style={{display:'inline-block',marginRight:'5px'}}>↻</span>Kurs wird abgerufen…
            </div>}
            {resolvedName&&!fetching&&<div style={{fontSize:'11px',color:'#566380',marginTop:'4px'}}>
              ✓ {resolvedName}{resolvedCcy?` · ${resolvedCcy}`:''}
              {fmpData?.isin&&<div style={{fontFamily:'monospace',fontSize:'10px',marginTop:'2px',color:'#4a5e7a'}}>
                ISIN {fmpData.isin}{fmpData.wkn?` · WKN ${fmpData.wkn}`:''}
              </div>}
            </div>}
          </div>
          <div className="fg">
            <label>Anzahl Aktien</label>
            <input type="number" placeholder="10" min="0.0001" step="any"
              value={f.shares} onChange={set('shares')} />
          </div>
          <div className="fg">
            <label>Kaufkurs {resolvedCcy&&!isEdit?<span style={{color:'#566380',fontWeight:400,textTransform:'none'}}>· aktuell vorausgefüllt, überschreibbar</span>:''}</label>
            <input type="number" placeholder="150.00" min="0.0001" step="any"
              value={f.buyPrice} onChange={set('buyPrice')} />
          </div>
          <div className="fg">
            <label>Kaufdatum</label>
            <input type="date" value={f.buyDate} onChange={set('buyDate')} />
          </div>
          <div className="fg">
            <label>Notiz (optional)</label>
            <input placeholder="z.B. Langfristposition" value={f.note} onChange={set('note')} />
          </div>
          {err&&<div className="err">{err}</div>}
          <div style={{display:'flex',gap:'8px',marginTop:'14px'}}>
            <button className="btn btn-primary" style={{flex:1}} disabled={busy||fetching}>
              {busy?<><span className="spinner">↻</span> Prüfe Kurs…</>
                  :fetching?<><span className="spinner">↻</span> Lädt…</>
                  :(isEdit?'Speichern':'Hinzufügen')}
            </button>
            <button type="button" className="btn btn-ghost" onClick={onClose}>Abbrechen</button>
          </div>
        </form>
      </div>
    </div>
  );
}

/* ── Speichern-Toast ── */
function Toast({msg,type,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t);},[onDone]);
  return <div className={`toast${type==='err'?' err-toast':''}`}>{msg}</div>;
}

/* ── Haupt-App ── */
function App(){
  const[pos,setPos]=useState([]);
  const[ready,setReady]=useState(false);
  const[modal,setModal]=useState(null);
  const[refreshing,setRefreshing]=useState(false);
  const[upd,setUpd]=useState(null);
  const[toast,setToast]=useState(null);
  const refreshingRef=useRef(false);
  /* KI-Portfolio state */
  const[view,setView]=useState('mine'); // 'mine'|'ai'|'compare'|'chart'
  const[chartRange,setChartRange]=useState('1y');
  const[aiPos,setAiPos]=useState([]);
  const[aiMeta,setAiMeta]=useState({generated_at:null,budget:50000});
  const[aiRefreshing,setAiRefreshing]=useState(false);
  const aiRefRef=useRef(false);

  const showToast=(msg,type='ok')=>setToast({msg,type,key:Date.now()});

  /* ── Initial load: localStorage → merge with server data ── */
  useEffect(()=>{
    let loaded=[];
    try{
      const s=localStorage.getItem(SK);
      if(s){const d=JSON.parse(s);if(Array.isArray(d))loaded=d;}
    }catch(e){}
    /* Server-injected initial data (from Railway Volume via Streamlit) */
    try{
      const srv=window.__SPIEL_INIT__;
      if(Array.isArray(srv)&&srv.length){
        if(!loaded.length){
          loaded=srv;  /* localStorage empty → use server data */
        } else {
          /* Merge: add server positions not in localStorage */
          const ids=new Set(loaded.map(p=>p.id));
          const extra=srv.filter(p=>!ids.has(p.id));
          if(extra.length) loaded=[...loaded,...extra];
        }
      }
    }catch(e){}
    setPos(loaded);
    setReady(true);
  },[]);

  /* ── Load AI portfolio from server injection ── */
  useEffect(()=>{
    try{
      const d=window.__AI_PORTFOLIO__;
      if(d&&Array.isArray(d.positions)&&d.positions.length){
        setAiPos(d.positions);
        setAiMeta({generated_at:d.generated_at,budget:d.budget||50000});
      }
    }catch(e){}
  },[]);

  /* ── Persist to localStorage ── */
  useEffect(()=>{
    if(!ready) return;
    localStorage.setItem(SK,JSON.stringify(pos));
  },[pos,ready]);

  /* ── Refresh prices ── */
  const refresh=useCallback(async(current)=>{
    if(!current.length||refreshingRef.current) return;
    refreshingRef.current=true;
    setRefreshing(true);
    let failed=0;
    const next=await Promise.all(current.map(async p=>{
      try{const q=await getQuote(p.ticker);
        return{...p,currentPrice:q.price,currency:q.currency,name:q.name,ts:Date.now()};}
      catch(e){failed++;return p;}
    }));
    setPos(next);setUpd(new Date());
    if(failed>0) showToast(`⚠️ ${failed} Kurs${failed>1?'e':''} nicht aktualisiert`,'err');
    refreshingRef.current=false;
    setRefreshing(false);
  },[]);

  /* ── Auto-refresh on mount + every 60s ── */
  const posRef=useRef(pos);
  useEffect(()=>{posRef.current=pos;},[pos]);
  useEffect(()=>{
    if(posRef.current.length) refresh(posRef.current);
    const t=setInterval(()=>refresh(posRef.current),60000);
    return()=>clearInterval(t);
  },[refresh]);

  /* ── Refresh AI portfolio prices (once on mount) ── */
  const refreshAi=useCallback(async(current)=>{
    if(!current.length||aiRefRef.current) return;
    aiRefRef.current=true;setAiRefreshing(true);
    const next=await Promise.all(current.map(async p=>{
      try{const q=await getQuote(p.ticker);return{...p,currentPrice:q.price,currency:q.currency};}
      catch(e){return p;}
    }));
    setAiPos(next);aiRefRef.current=false;setAiRefreshing(false);
  },[]);
  const aiPosRef=useRef(aiPos);
  useEffect(()=>{aiPosRef.current=aiPos;},[aiPos]);
  useEffect(()=>{if(aiPosRef.current.length) refreshAi(aiPosRef.current);},[refreshAi]);

  function upsert(p){
    setPos(prev=>{const i=prev.findIndex(x=>x.id===p.id);
      if(i>=0){const n=[...prev];n[i]=p;return n;}return[...prev,p];});
  }
  function del(id){
    if(!window.confirm('Position löschen?')) return;
    setPos(p=>p.filter(x=>x.id!==id));
  }

  /* ── Auf Server sichern ── */
  function saveToServer(){
    const data=btoa(unescape(encodeURIComponent(JSON.stringify(pos))));
    /* Try to navigate parent Streamlit page with save param */
    try{
      const url=new URL(window.parent.location.href);
      url.searchParams.set('spiel_save',data);
      window.parent.location.href=url.toString();
    }catch(e){
      /* Fallback: copy to clipboard */
      try{
        navigator.clipboard.writeText(JSON.stringify(pos,null,2));
        showToast('📋 JSON kopiert — oben im Textfeld einfügen & speichern');
      }catch(e2){
        showToast('Speichern fehlgeschlagen — bitte Seite neu laden','err');
      }
    }
  }

  /* ── Berechnungen ── */
  /* Group by currency for correct totals */
  const byCcy={};
  pos.forEach(p=>{
    const c=p.currency||'USD';
    if(!byCcy[c]) byCcy[c]={buy:0,cur:0};
    const cur=p.currentPrice??p.buyPrice;
    byCcy[c].buy+=p.buyPrice*p.shares;
    byCcy[c].cur+=cur*p.shares;
  });
  const ccys=Object.keys(byCcy);
  const singleCcy=ccys.length<=1;
  /* Use first / only currency for summary cards */
  const mainCcy=ccys[0]||'EUR';
  const mainSym=ccySym(mainCcy);
  const totalBuy=singleCcy?(byCcy[mainCcy]?.buy||0):null;
  const totalCur=singleCcy?(byCcy[mainCcy]?.cur||0):null;
  const totalGain=totalBuy!=null&&totalCur!=null?totalCur-totalBuy:null;
  const totalGainPct=totalBuy?totalGain/totalBuy*100:null;

  const sortedPos=[...pos].sort((a,b)=>{
    const va=(a.currentPrice??a.buyPrice)*a.shares;
    const vb=(b.currentPrice??b.buyPrice)*b.shares;
    return vb-va;
  });
  const grandCur=pos.reduce((s,p)=>s+(p.currentPrice??p.buyPrice)*p.shares,0)||1;

  /* ── Render ── */
  if(!ready) return <div className="muted" style={{padding:'32px',textAlign:'center'}}>Lädt…</div>;

  /* ── AI portfolio stats (used in compare view) ── */
  const aiGrandCur=aiPos.reduce((s,p)=>s+(p.currentPrice??p.buyPrice)*p.shares,0)||1;
  const aiTotalBuyAll=aiPos.reduce((s,p)=>s+p.buyPrice*p.shares,0);
  const aiTotalCurAll=aiPos.reduce((s,p)=>s+(p.currentPrice??p.buyPrice)*p.shares,0);
  const aiTotalGain=aiTotalCurAll-aiTotalBuyAll;
  const aiTotalGainPct=aiTotalBuyAll>0?aiTotalGain/aiTotalBuyAll*100:null;

  return(
    <>
    {toast&&<Toast key={toast.key} msg={toast.msg} type={toast.type} onDone={()=>setToast(null)}/>}

    {/* Tab Switcher */}
    <div style={{display:'flex',gap:'6px',marginBottom:'13px'}}>
      {[['mine','📊 Depot'],['ai','🤖 KI-Depot'],['compare','⚖️ Vergleich'],['chart','📈 Chart']].map(([v,lbl])=>(
        <button key={v} onClick={()=>setView(v)}
          className={`btn ${view===v?'btn-primary':'btn-ghost'}`}
          style={{flex:1,fontSize:'12px',padding:'7px 5px'}}>
          {lbl}
        </button>
      ))}
    </div>

    {/* ═══════ MEIN DEPOT ═══════ */}
    {view==='mine'&&<>
    {/* Summary */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(148px,1fr))',gap:'10px',marginBottom:'14px'}}>
      {singleCcy?[
        {l:'Depot-Wert',v:abs(totalCur,mainSym),c:''},
        {l:'Einstand',v:abs(totalBuy,mainSym),c:''},
        {l:'Gewinn / Verlust',v:diff(totalGain,mainSym),c:clr(totalGain)},
        {l:'Performance',v:pct(totalGainPct),c:clr(totalGainPct)},
      ].map(({l,v,c})=>(
        <div className="sumcard" key={l}>
          <div className="sum-label">{l}</div>
          <div className={`sum-val ${c}`}>{v}</div>
        </div>
      )):(
        ccys.map(c=>{
          const g=byCcy[c].cur-byCcy[c].buy;
          const gp=byCcy[c].buy?g/byCcy[c].buy*100:null;
          const sym=ccySym(c);
          return(
            <div className="sumcard" key={c}>
              <div className="sum-label">Depot {c}</div>
              <div className="sum-val">{abs(byCcy[c].cur,sym)}</div>
              <div className={`${clr(g)}`} style={{fontSize:'13px',marginTop:'4px'}}>
                {diff(g,sym)} ({pct(gp,'–')})
              </div>
            </div>
          );
        })
      )}
    </div>

    {!singleCcy&&(
      <div className="warn">
        ⚠️ Depot enthält Positionen in verschiedenen Währungen ({ccys.join(', ')}).
        Gesamtperformance wird je Währung separat angezeigt — kein Kurs-Umrechnung.
      </div>
    )}

    {/* Toolbar */}
    <div style={{alignItems:'center',display:'flex',flexWrap:'wrap',gap:'8px',justifyContent:'space-between',marginBottom:'8px'}}>
      <span className="muted" style={{fontSize:'11px'}}>
        {upd&&`↺ ${upd.toLocaleTimeString('de-DE')}  `}
        {pos.length>0&&<span className="tag">{pos.length} Position{pos.length!==1?'en':''}</span>}
      </span>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        {pos.length>0&&(
          <button className="btn btn-ghost" onClick={()=>refresh(pos)} disabled={refreshing}
            style={{fontSize:'12px',padding:'6px 12px'}} aria-label="Kurse aktualisieren">
            <span className={refreshing?'spinner':''} style={{display:'inline-block',marginRight:'5px'}}>↻</span>
            {refreshing?'Lädt…':'Kurse'}
          </button>
        )}
        <button className="btn btn-primary" onClick={()=>setModal('new')}
          style={{fontSize:'12px',padding:'6px 12px'}} aria-label="Position hinzufügen">
          ＋ Position
        </button>
      </div>
    </div>
    {pos.length>0&&(
      <button className="btn btn-save" onClick={saveToServer}
        style={{width:'100%',padding:'9px',fontSize:'13px',marginBottom:'12px',borderRadius:'9px',
                background:'linear-gradient(135deg,#0a2a1e,#0e3528)',borderColor:'#00c9a7'}}
        aria-label="Depot auf Railway-Server speichern">
        ☁️ Depot auf Server speichern
      </button>
    )}
    {/* Table */}
    <div className="card" style={{overflowX:'auto'}}>
      {pos.length===0?(
        <div className="empty">
          <div style={{fontSize:'36px',marginBottom:'10px',opacity:.2}}>📊</div>
          <div className="muted" style={{marginBottom:'16px',fontSize:'13px'}}>Noch kein Depot aufgebaut</div>
          <button className="btn btn-primary" onClick={()=>setModal('new')}>Erste Position hinzufügen</button>
        </div>
      ):(
        <table>
          <thead><tr>
            <th className="left" style={{paddingLeft:'14px'}}>Aktie</th>
            <th>Datum</th>
            <th>Stück</th>
            <th>Kaufkurs</th>
            <th>Einstand</th>
            <th>Kurs</th>
            <th>Wert</th>
            <th>+/– €/$</th>
            <th>+/– %</th>
            <th>Anteil</th>
            <th style={{paddingRight:'14px'}}></th>
          </tr></thead>
          <tbody>
          {sortedPos.map(p=>{
            const cur=p.currentPrice;
            const hasCur=cur!=null&&!isNaN(cur);
            const dispCur=hasCur?cur:p.buyPrice;
            const buyCost=p.buyPrice*p.shares;
            const curVal=dispCur*p.shares;
            const g=hasCur?curVal-buyCost:null;
            const gPct=hasCur&&buyCost>0?(curVal/buyCost-1)*100:null;
            const wt=grandCur>0?curVal/grandCur*100:0;
            const sym=ccySym(p.currency||'USD');
            return(
              <tr key={p.id}>
                <td className="left" style={{paddingLeft:'14px'}}>
                  <span className="badge">{p.ticker}</span>
                  <div style={{color:'#566380',fontSize:'10px',marginTop:'2px',maxWidth:'120px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name||''}</div>
                  {p.note&&<div style={{color:'#3a6050',fontSize:'10px'}}>{p.note}</div>}
                  {p.isin&&<div style={{color:'#3a4860',fontSize:'9px',fontFamily:'monospace',marginTop:'1px',whiteSpace:'nowrap'}}>
                    {p.isin}{p.wkn?` · WKN ${p.wkn}`:''}
                  </div>}
                </td>
                <td><span className="muted" style={{fontSize:'11px'}}>{p.buyDate}</span></td>
                <td>{de(p.shares, Number.isInteger(p.shares)?0:p.shares<10?3:2)}</td>
                <td>{de(p.buyPrice)}{' '}{sym}</td>
                <td>{de(buyCost)}{' '}{sym}</td>
                <td style={{fontWeight:600}}>
                  {hasCur?<>{de(dispCur)}{' '}{sym}</>
                    :<span className="muted" style={{fontSize:'11px'}}>–</span>}
                </td>
                <td style={{fontWeight:600}}>{de(curVal)}{' '}{sym}</td>
                <td className={clr(g)}>{diff(g,sym)}</td>
                <td className={clr(gPct)} style={{fontWeight:600}}>{pct(gPct)}</td>
                <td>
                  <div style={{alignItems:'flex-end',display:'flex',flexDirection:'column',gap:'3px'}}>
                    <span style={{fontSize:'11px'}}>{de(wt,1)}%</span>
                    <div className="bar-track"><div className="bar-fill" style={{width:`${Math.min(wt,100)}%`}}/></div>
                  </div>
                </td>
                <td style={{paddingRight:'14px'}}>
                  <div style={{display:'flex',gap:'5px',justifyContent:'flex-end'}}>
                    <button className="btn-icon" title="Bearbeiten" aria-label="Bearbeiten"
                      onClick={()=>setModal({...p,shares:String(p.shares),buyPrice:String(p.buyPrice)})}>✎</button>
                    <button className="btn-del" title="Löschen" aria-label="Löschen"
                      onClick={()=>del(p.id)}>✕</button>
                  </div>
                </td>
              </tr>
            );
          })}
          </tbody>
        </table>
      )}
    </div>

    <div style={{color:'#2a3854',fontSize:'10px',marginTop:'10px',textAlign:'center'}}>
      Kurse via Yahoo Finance · localStorage + Railway Volume · Keine Anlageberatung
    </div>
    </>}

    {/* ═══════ KI-DEPOT ═══════ */}
    {view==='ai'&&<>
      {aiPos.length===0?(
        <div className="empty">
          <div style={{fontSize:'40px',marginBottom:'10px',opacity:.25}}>🤖</div>
          <div className="muted" style={{marginBottom:'8px',fontSize:'13px'}}>Kein KI-Portfolio vorhanden</div>
          <div style={{color:'#3a4a60',fontSize:'11px',lineHeight:1.6}}>
            Im Sidebar auf <strong style={{color:'#00c9a7'}}>🤖 KI-Portfolio erstellen</strong> klicken.<br/>
            Gemini wählt 15 Aktien nach Quality+Value-Faktoren.
          </div>
        </div>
      ):(
        <>
          <div style={{background:'#081e14',border:'1px solid #0e4030',borderRadius:'10px',
                       padding:'10px 14px',marginBottom:'12px',
                       display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:'8px'}}>
            <div>
              <span style={{color:'#00c9a7',fontWeight:700,fontSize:'13px'}}>🤖 Gemini Quality+Value Portfolio</span>
              {aiMeta.generated_at&&<span style={{color:'#566380',fontSize:'11px',marginLeft:'10px'}}>Erstellt: {aiMeta.generated_at} · Budget: 50.000€</span>}
            </div>
            <button className="btn btn-ghost" onClick={()=>refreshAi(aiPos)} disabled={aiRefreshing}
              style={{fontSize:'12px',padding:'5px 11px'}}>
              <span className={aiRefreshing?'spinner':''} style={{display:'inline-block',marginRight:'4px'}}>↻</span>
              {aiRefreshing?'Lädt…':'Kurse'}
            </button>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(148px,1fr))',gap:'10px',marginBottom:'14px'}}>
            {[
              {l:'Portfolio-Wert',v:de(aiTotalCurAll)+' '+(aiPos[0]?ccySym(aiPos[0].currency||'USD'):'$'),c:''},
              {l:'Einstand',v:de(aiTotalBuyAll)+' '+(aiPos[0]?ccySym(aiPos[0].currency||'USD'):'$'),c:''},
              {l:'Gewinn / Verlust',v:(aiTotalGain>=0?'+':'')+de(aiTotalGain)+' '+(aiPos[0]?ccySym(aiPos[0].currency||'USD'):'$'),c:clr(aiTotalGain)},
              {l:'Performance',v:pct(aiTotalGainPct),c:clr(aiTotalGainPct)},
            ].map(({l,v,c})=>(
              <div className="sumcard" key={l}>
                <div className="sum-label">{l}</div>
                <div className={`sum-val ${c}`}>{v}</div>
              </div>
            ))}
          </div>
          <div className="card" style={{overflowX:'auto'}}>
            <table>
              <thead><tr>
                <th className="left" style={{paddingLeft:'14px'}}>Aktie</th>
                <th>Kaufkurs</th>
                <th>Kurs</th>
                <th>+/– %</th>
                <th style={{paddingRight:'14px'}}>Anteil</th>
              </tr></thead>
              <tbody>
              {[...aiPos].sort((a,b)=>{
                const va=(a.currentPrice??a.buyPrice)*a.shares;
                const vb=(b.currentPrice??b.buyPrice)*b.shares;
                return vb-va;
              }).map((p,i)=>{
                const cur=p.currentPrice??p.buyPrice;
                const g=p.buyPrice>0?(cur/p.buyPrice-1)*100:null;
                const wt=aiGrandCur>0?(cur*p.shares)/aiGrandCur*100:0;
                const sym=ccySym(p.currency||'USD');
                return(
                  <tr key={p.id||i}>
                    <td className="left" style={{paddingLeft:'14px'}}>
                      <span className="badge">{p.ticker}</span>
                      {p.note&&<div style={{color:'#3a6050',fontSize:'10px',marginTop:'2px'}}>{p.note}</div>}
                      {!p.note&&<div style={{color:'#566380',fontSize:'10px',marginTop:'2px',maxWidth:'110px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name||''}</div>}
                    </td>
                    <td>{de(p.buyPrice)}{' '}{sym}</td>
                    <td style={{fontWeight:600}}>{de(cur)}{' '}{sym}</td>
                    <td className={clr(g)} style={{fontWeight:600}}>{pct(g)}</td>
                    <td style={{paddingRight:'14px'}}>
                      <div style={{alignItems:'flex-end',display:'flex',flexDirection:'column',gap:'3px'}}>
                        <span style={{fontSize:'11px'}}>{de(wt,1)}%</span>
                        <div className="bar-track"><div className="bar-fill" style={{width:`${Math.min(wt,100)}%`}}/></div>
                      </div>
                    </td>
                  </tr>
                );
              })}
              </tbody>
            </table>
          </div>
          <div style={{color:'#2a3854',fontSize:'10px',marginTop:'10px',textAlign:'center'}}>
            KI-Depot ist schreibgeschützt · Kurse via Yahoo Finance · Keine Anlageberatung
          </div>
        </>
      )}
    </>}

    {/* ═══════ VERGLEICH ═══════ */}
    {view==='compare'&&<>
      {(pos.length===0&&aiPos.length===0)?(
        <div className="empty">
          <div style={{fontSize:'36px',marginBottom:'10px',opacity:.2}}>⚖️</div>
          <div className="muted" style={{fontSize:'13px'}}>
            Erst Positionen in Mein Depot hinzufügen<br/>und ein KI-Portfolio erstellen.
          </div>
        </div>
      ):(
        <>
          {(()=>{
            const myRet=totalBuy>0?totalGainPct:null;
            const aiRet=aiTotalBuyAll>0?aiTotalGainPct:null;
            const myWins=myRet!=null&&aiRet!=null&&myRet>aiRet;
            const aiWins=myRet!=null&&aiRet!=null&&aiRet>myRet;
            return(
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px',marginBottom:'14px'}}>
                {[
                  {label:'Mein Depot',emoji:'📊',
                   ret:myRet,val:totalCur,buy:totalBuy,gain:totalGain,
                   sym:mainSym,wins:myWins,cnt:pos.length},
                  {label:'KI-Depot (Gemini)',emoji:'🤖',
                   ret:aiRet,val:aiTotalCurAll,buy:aiTotalBuyAll,gain:aiTotalGain,
                   sym:'$',wins:aiWins,cnt:aiPos.length},
                ].map(d=>(
                  <div key={d.label} className="card" style={{
                    padding:'16px',
                    border: d.wins?'1px solid #00c9a7':'1px solid #1e2d47',
                    position:'relative',
                  }}>
                    {d.wins&&<div style={{position:'absolute',top:'-10px',left:'50%',transform:'translateX(-50%)',
                      background:'#00c9a7',color:'#000',fontSize:'10px',fontWeight:700,
                      padding:'2px 8px',borderRadius:'10px',whiteSpace:'nowrap'}}>
                      🏆 Führt
                    </div>}
                    <div style={{fontSize:'13px',fontWeight:700,marginBottom:'12px',color:'#f0f4ff'}}>
                      {d.emoji} {d.label}
                    </div>
                    <div style={{marginBottom:'6px'}}>
                      <div className="sum-label">Performance</div>
                      <div className={`sum-val ${clr(d.ret)}`} style={{fontSize:'22px'}}>
                        {d.ret!=null?pct(d.ret):<span className="muted" style={{fontSize:'14px'}}>Kein Depot</span>}
                      </div>
                    </div>
                    <div style={{borderTop:'1px solid #1e2d47',paddingTop:'8px',marginTop:'8px',fontSize:'11px',color:'#566380'}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'3px'}}>
                        <span>Wert</span><span style={{color:'#c4cfe0'}}>{d.val>0?de(d.val)+' '+d.sym:'–'}</span>
                      </div>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:'3px'}}>
                        <span>G+V</span>
                        <span className={clr(d.gain)}>
                          {d.gain!=null?(d.gain>=0?'+':'')+de(d.gain)+' '+d.sym:'–'}
                        </span>
                      </div>
                      <div style={{display:'flex',justifyContent:'space-between'}}>
                        <span>Positionen</span><span style={{color:'#c4cfe0'}}>{d.cnt}</span>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            );
          })()}
          <div style={{color:'#2a3854',fontSize:'10px',textAlign:'center',lineHeight:1.6}}>
            Vergleich basiert auf Einstandspreisen. Währungen können abweichen. Keine Anlageberatung.
          </div>
        </>
      )}
    </>}

    {/* ═══════ PERFORMANCE CHART ═══════ */}
    {view==='chart'&&<>
      <div className="chart-wrap">
        <div className="chart-hdr">
          <span className="chart-ttl">📈 Portfolio vs. S&amp;P 500</span>
          <div className="rng-btns">
            {['6m','1y','2y','5y'].map(r=>(
              <button key={r}
                className={`rng-btn${chartRange===r?' active':''}`}
                onClick={()=>setChartRange(r)}>
                {r.toUpperCase()}
              </button>
            ))}
          </div>
        </div>
        <PortPerfChart myPositions={pos} aiPositions={aiPos} range={chartRange}/>
      </div>
    </>}

    {modal&&(
      <PosModal
        initial={modal==='new'?null:modal}
        onSave={upsert}
        onClose={()=>setModal(null)}
      />
    )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
